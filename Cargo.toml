[package]
name = "splice-compositor"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Smithay-based Wayland compositor for Splice"

[patch.crates-io]
# smithay 0.7.0 plus a few small patches; see vendor/README.md.
smithay = { path = "vendor/smithay" }

[workspace]
members = [".", "crates/*"]
exclude = ["vendor/smithay"]

# The one version of all crates and of the Nix packages (nix/package.nix, nix/settings.nix).
[workspace.package]
version = "0.1.0"

[dependencies]
splice-layout = { path = "crates/splice-layout" }
splice-theme = { path = "crates/splice-theme" }
splice-config = { path = "crates/splice-config" }
png = "0.17"
# Already built for splice-theme; decodes the wallpaper.
image = "0.25"
libc = "0.2"
# Marks the primary output on Xwayland (RandR), the way xrandr does; the version smithay uses.
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
splice-ipc = { path = "crates/splice-ipc" }
# The built-in shell's pictures (bar, power menu, notices).
splice-ui = { path = "crates/splice-ui" }
# What the shell services process says and is told.
splice-shell-protocol = { path = "crates/splice-shell-protocol" }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    # The cursor plane on rotated or scaled outputs (else the cursor is composited there on every move).
    "renderer_pixman",
    "xwayland",
    "desktop",
    "wayland_frontend",
] }
calloop = "0.14"
smithay-drm-extras = { version = "0.1", default-features = false }
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

# For hardware tests (`scripts/dev-install`): optimized like release, but without LTO and with
# incremental, parallel codegen, so that a change builds in well under a minute instead of minutes.
# Frame timings measured with it are slightly worse than the release build's.
[profile.hwtest]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[dev-dependencies]
drm-ffi = "0.9"
