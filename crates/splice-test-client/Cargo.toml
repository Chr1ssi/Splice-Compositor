[package]
name = "splice-test-client"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "Wayland test client: keyboard-shortcuts-inhibit and xdg-activation (used by the smoke tests)"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
libc = "0.2"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
